# Clash Meta 手机 — VLESS Reality
# 导入后节点必须选 vps-reality（类型 VLESS，不是 Socks5）

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  inet4-route-exclude-address:
    - 43.135.173.248/32

proxies:
  - name: vps-reality
    type: vless
    server: 43.135.173.248
    port: 443
    uuid: 29bad373-6e0f-4c49-aa69-2067451df572
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: YEVlP8Qu8L5LlWUiw5YyJ50c32U93AQqcR-VOI0FVzQ
      short-id: 47a613e1866d6f68

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - vps-reality
      - DIRECT

rules:
  - IP-CIDR,43.135.173.248/32,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - GEOIP,PRIVATE,DIRECT,no-resolve
  - MATCH,PROXY
