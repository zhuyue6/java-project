# Clash Meta 手机配置
# 默认用 8888（运营商对 443 常超时）。导入后选节点 vps-8888，开启 TUN/VPN。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  inet4-route-exclude-address:
    - 43.135.173.248/32

proxies:
  - name: vps-8888
    type: socks5
    server: 43.135.173.248
    port: 8888
    username: clash
    password: ZySb7890xClash
    udp: true
  - name: vps-443
    type: socks5
    server: 43.135.173.248
    port: 443
    username: clash
    password: ZySb7890xClash
    udp: true

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - vps-8888
      - vps-443
      - DIRECT

rules:
  - IP-CIDR,43.135.173.248/32,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - GEOIP,PRIVATE,DIRECT,no-resolve
  - MATCH,PROXY
