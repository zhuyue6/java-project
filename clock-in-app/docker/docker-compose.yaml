version: '3.8'

services:
  mysql:
    # 镜像
    image: mysql:8.0
    # 容器名称
    container_name: mysql
    # 重启策略：自动重启
    restart: always
    # # 数据挂载（卷挂载）两种写法：命名卷 / 绑定挂载
    volumes:
      # 命名卷：数据持久化卷
      - mysql-data:/var/lib/mysql
      # 绑定挂载：初始化脚本：仅在数据目录为空（首次启动）时执行
      - ./mysql/init:/docker-entrypoint-initdb.d

    # 环境变量
    environment:
      # root密码
      MYSQL_ROOT_PASSWORD: 123456   # root密码，务必修改
      # 数据库名称
      MYSQL_DATABASE: clock_in
      # 时区
      TZ: Asia/Shanghai
    # 端口
    ports:
      - "3306:3306"
    # 网络，`networks` 用来**定义容器之间的独立局域网**
    networks:
      - app-net
  
  # redis 服务
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass "123456" --appendonly yes

volumes:
  mysql-data:
  redis-data:

networks:
  app-net: