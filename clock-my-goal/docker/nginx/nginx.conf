user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # 开启高效传输模式
    sendfile on;
    # 减少网络小包，合并发送
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 60s;

    # 开启 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1k;

    # 跨域只在 nginx 处理。命中的 Origin 原样回写，未命中则为空，浏览器会拒绝
    map $http_origin $cors_origin {
        default "";
        "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
        "~^https?://([a-z0-9-]+\.)?zywyy\.cn(:[0-9]+)?$" $http_origin;
    }

    server {
        listen 80;
        server_name zywyy.cn;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            # 先找 $uri 文件，没有再找 $uri/ 目录，都没有则返回 /index.html，前端 history 模式需要
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # 预检不转发给 Spring。if 里的 add_header 不会继承到外面，所以正式响应要再写一遍
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Vary Origin always;
                return 204;
            }

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Vary Origin always;

            # 丢掉上游可能带出的 CORS 头，避免和 nginx 重复
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Vary;

            # 末尾的 / 会去掉前缀 /api/，/api/admin/auth/login 转发为 /admin/auth/login
            proxy_pass http://clock-my-goal:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 空值表示不转发给上游，Spring 看不到 Origin，不会进入 CORS 校验
            proxy_set_header Origin "";
        }
    }

    server {
        listen 443 ssl;
        server_name zywyy.cn;
        # 证书路径
        ssl_certificate     /etc/nginx/ssl/zywyy.crt;
        ssl_certificate_key /etc/nginx/ssl/zywyy.key;

        # 强制使用 TLSv1.2 和 TLSv1.3 协议
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            # 先找 $uri 文件，没有再找 $uri/ 目录，都没有则返回 /index.html，前端 history 模式需要
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Vary Origin always;
                return 204;
            }

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Vary Origin always;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Vary;

            proxy_pass http://clock-my-goal:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin "";
        }
    }
}
