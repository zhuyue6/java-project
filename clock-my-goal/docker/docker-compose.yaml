version: '3.8'

services:
  mysql:
    # 镜像
    image: mysql:8.0
    # 容器名称
    container_name: mysql
    # 重启策略：自动重启
    restart: always
    # # 数据挂载（卷挂载）两种写法：命名卷 / 绑定挂载
    volumes:
      # 命名卷：数据持久化卷
      - mysql-data:/var/lib/mysql
      # 绑定挂载：初始化脚本：仅在数据目录为空（首次启动）时执行
      - ./mysql/init:/docker-entrypoint-initdb.d

    # 环境变量
    environment:
      # root密码
      MYSQL_ROOT_PASSWORD: 123456   # root密码，务必修改
      # 数据库名称
      MYSQL_DATABASE: clock_in
      # 时区
      TZ: Asia/Shanghai
    # 端口
    ports:
      - "3306:3306"
    # 网络，`networks` 用来**定义容器之间的独立局域网**
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # redis 服务
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass "123456" --appendonly yes
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clock-my-goal:
    build:
      context: ../..
      dockerfile: clock-my-goal/Dockerfile
    image: clock-my-goal:0.1.0
    container_name: clock-my-goal
    restart: always
    ports:
      - "9090:9090"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 9090
      DB_URL: jdbc:mysql://mysql:3306/clock_in?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_PASSWORD: "123456"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "123456"
      # HS256 密钥至少 32 字节，上线前请更换
      JWT_SECRET: zhuyueaiwangyingying520520~!@@!~
      JWT_EXPIRATION: 86400000
      WX_APPID: your-wx-appid
      WX_SECRET: your-wx-secret
      ACCESS_PREFIX: http://localhost:9090
    volumes:
      - app-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net

volumes:
  mysql-data:
  redis-data:
  app-logs:

networks:
  app-net: